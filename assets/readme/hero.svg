<text x="640" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7C8B98">score.abc &#183; the plan, written before any audio</text>
<text x="670.0" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7C8B98">intro</text>
