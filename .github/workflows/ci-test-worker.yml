name: CI | Test Worker

# Runs on every push and PR, and needs no GPU, no RunPod account and no B2
# credentials. That is deliberate: the Stage 02 contract requires the suite to
# run locally with GPU and S3 mocked, so the same suite gates the build.
#
# The GPU-dependent half (one real create job against a warm volume) is the
# stage's `## Human check`, run by a person on real hardware. It is not here,
# because a workflow that cannot run is worse than no workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Only the test/lint tooling. The suite mocks torch and boto3 by design,
        # so installing 2.5 GB of CUDA wheels to run it would be waste.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint
        run: ruff check worker tests

      - name: Format check
        run: ruff format --check worker tests

      - name: Type check
        # Non-blocking: the worker imports torch, yue2 and boto3, none of which
        # are installed here, so pyright reports unresolved imports by design.
        continue-on-error: true
        run: |
          pip install pyright
          pyright

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Smoke-test the handler entrypoint
        # Proves the module imports and the flat-import layout resolves, which is
        # the failure the Dockerfile's own import check also guards.
        run: |
          cd worker
          python -c "import config, schema, storage, boot, handler; print('imports OK')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # No push, no secrets. Catches Dockerfile breakage (a moved file, a
        # broken wheel URL) without needing registry credentials.
        run: docker build -f worker/Dockerfile -t yue2-worker:ci .
