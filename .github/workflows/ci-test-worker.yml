name: CI | Test Worker

# Runs on every push and PR, and needs no GPU, no RunPod account and no B2
# credentials. That is deliberate: the Stage 02 contract requires the suite to
# run locally with GPU and S3 mocked, so the same suite gates the build.
#
# The GPU-dependent half (one real create job against a warm volume) is the
# stage's `## Human check`, run by a person on real hardware. It is not here,
# because a workflow that cannot run is worse than no workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Only the test/lint tooling, plus boto3 — no torch. Installing 2.5 GB of
        # CUDA wheels to run a suite that mocks the GPU would be waste.
        #
        # **`boto3` is deliberately here, and this step is why CI was red for its
        # first 49 runs.** The earlier comment claimed "the suite mocks torch and
        # boto3 by design". Torch, yes. boto3, no: the fixtures inject a fake S3
        # *client* into `B2Storage(client=...)`, but `upload_file` still runs for
        # real and calls `boto3.s3.transfer.TransferConfig`. With boto3 absent
        # that raised `ModuleNotFoundError`, which `upload_file`'s own
        # `except Exception` converted into "Upload of audio.flac failed" — a
        # message that reads like a B2 problem and sent three storage tests red.
        #
        # The pin is read from `worker/requirements.txt` rather than restated, so
        # CI tests the same boto3 the image ships and the two cannot drift.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          BOTO3_PIN="$(grep -E '^boto3==' worker/requirements.txt)"
          test -n "$BOTO3_PIN" || { echo "::error::no boto3 pin in worker/requirements.txt"; exit 1; }
          echo "installing $BOTO3_PIN (the pin the image ships)"
          pip install "$BOTO3_PIN"

      - name: Lint
        run: ruff check worker tests

      - name: Format check
        run: ruff format --check worker tests

      - name: Type check
        # Non-blocking: the worker imports torch and yue2, neither of which is
        # installed here, so pyright reports unresolved imports by design.
        # boto3 *is* installed (above), so its call sites are checked for real.
        continue-on-error: true
        run: |
          pip install pyright
          pyright

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check the flat-import layout resolves
        # A syntax + layout check that does NOT import `handler`.
        #
        # Importing it boots the pipeline and calls `runpod.serverless.start` at
        # module scope (the standard RunPod shape), so a real import here would
        # try to download weights into the CI runner and start a server. The
        # Dockerfile makes the same distinction.
        run: |
          cd worker
          python -m py_compile *.py && echo "modules compile"
          python -c "import config, schema, storage, boot; print('imports OK')"

  # No docker-build job, deliberately.
  #
  # The image is built by **RunPod's platform** from this repository, per locked
  # decision 1 ("nothing installed or executed on any dev/ops box we control").
  # Rebuilding it here would duplicate that work on a runner, and a green CI
  # build proves nothing about the environment that actually serves traffic.
  # RunPod's endpoint "Builds" tab is the real signal.
